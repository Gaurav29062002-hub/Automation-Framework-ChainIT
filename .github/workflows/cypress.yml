name: Cypress E2E Tests

on:
  push:
    branches:
      - main
      - develop
      - master

  pull_request:
    branches:
      - main
      - develop
      - master

  workflow_dispatch:

  schedule:
    - cron: '15 11 * * *'
      timezone: 'Asia/Kolkata'

jobs:
  cypress:
    name: Run Cypress E2E Tests

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT CODE
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SETUP NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: npm ci


      # ==========================================
      # RUN CYPRESS
      # ==========================================

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npm run cypress:run -- --record
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}


      # ==========================================
      # UPLOAD MOCHAWESOME REPORT
      # ==========================================

      - name: Upload Cypress Mochawesome Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: cypress/reports
          if-no-files-found: warn


      # ==========================================
      # SEND TEST REPORT BY EMAIL
      # ==========================================

      - name: Send Cypress Report Email
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "ChainIT Cypress E2E Test Report - ${{ job.status }}"

          to: ${{ secrets.MAIL_TO }}
          from: "ChainIT Automation <${{ secrets.MAIL_USERNAME }}>"

          body: |
            Hello,

            The ChainIT Cypress E2E test execution has completed.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Status:
            ${{ job.status }}

            Workflow:
            ${{ github.workflow }}

            Run:
            #${{ github.run_number }}

            Commit:
            ${{ github.sha }}

            The Mochawesome HTML report is attached to this email.

            You can also view the complete GitHub Actions run here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            ChainIT Automation

          attachments: cypress/reports/index.html


      # ==========================================
      # UPLOAD SCREENSHOTS
      # ==========================================

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore


      # ==========================================
      # UPLOAD VIDEOS
      # ==========================================

      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore