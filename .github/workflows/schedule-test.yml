
name: Schedule Test

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Asia/Kolkata'

  workflow_dispatch:

jobs:
  schedule-test:
    name: Verify GitHub Scheduler

    runs-on: ubuntu-latest

    steps:
      - name: Confirm scheduled execution
        run: |
          echo "======================================"
          echo "GitHub Schedule Test"
          echo "======================================"
          echo "Workflow triggered successfully."
          echo "Current UTC time:"
          date -u
          echo "Current IST time:"
          TZ=Asia/Kolkata date
          echo "======================================"

